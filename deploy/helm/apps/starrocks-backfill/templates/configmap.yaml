apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "starrocks-backfill.configName" . }}
data:
  STARROCKS_USERNAME: {{ .Values.credentials.username | quote }}
  STARROCKS_PASSWORD: {{ .Values.credentials.password | quote }}
  application.properties: |
    backfill.start={{ required "backfill.start is required" .Values.backfill.start }}
    backfill.end={{ required "backfill.end is required" .Values.backfill.end }}
    backfill.path={{ required "backfill.path is required" .Values.backfill.path }}
    hadoop.config.directory=/etc/hadoop/conf
    starrocks.jdbc.url={{ .Values.starrocks.jdbcUrl }}
    {{- range $key, $value := .Values.jdbc }}
    jdbc.{{ $key }}={{ $value }}
    {{- end }}
    {{- range $key, $value := .Values.session }}
    session.{{ $key }}={{ $value }}
    {{- end }}
