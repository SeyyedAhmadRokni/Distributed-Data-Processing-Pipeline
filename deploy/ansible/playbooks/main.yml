---
- name: Deploy Apache Kafka on 4 Nodes (KRaft Mode)
  hosts: kafka
  tags: [kafka]
  roles:
    - kafka

- name: Prepare StarRocks artifacts
  hosts: starrocks
  any_errors_fatal: true
  tags: [starrocks]
  pre_tasks:
    - name: Install StarRocks controller Python dependency
      ansible.builtin.pip:
        name: "PyMySQL==1.2.0"
        extra_args: >-
          --user
          --trusted-host nexus.example.com
          --index-url https://nexus.example.com/repository/PyPi/simple
      delegate_to: localhost
      run_once: true
      become: false
  roles:
    - starrocks_artifacts

- name: Deploy StarRocks FE
  hosts: starrocks_fe
  serial: 1
  any_errors_fatal: true
  tags: [starrocks]
  roles:
    - starrocks_fe

- name: Deploy StarRocks BE
  hosts: starrocks_be
  serial: 1
  any_errors_fatal: true
  tags: [starrocks]
  roles:
    - starrocks_be

- name: Initialize and verify StarRocks database
  hosts: starrocks_leader
  tags: [starrocks]
  roles:
    - starrocks_sql
